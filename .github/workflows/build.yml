name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;24.0.8215888 cmake;3.22.1"
          accept-licenses: "true"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: make dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiamondRuntime-APK
          path: dist/*.apk
          if-no-files-found: error

  components:
    name: Build native components
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan headers
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - name: Build vortek + gladio
        run: make vortek gladio
      - name: Upload shared libraries
        uses: actions/upload-artifact@v4
        with:
          name: Native-Libs
          path: |
            vortek/build/libvulkan_vortek.so
            gladio/build/libGL.so
          if-no-files-found: error
