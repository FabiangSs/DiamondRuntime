name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;24.0.8215888 cmake;3.22.1"
          accept-licenses: "true"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.3.3"
          validate-wrappers: false

      - name: Generate gradle wrapper
        run: gradle -p app wrapper

      - name: Build APK
        run: make dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiamondRuntime-APK
          path: dist/*.apk
          if-no-files-found: error
